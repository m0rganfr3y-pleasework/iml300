	}

		transform: scale(1);
	}
}
        .lungs{
         position:absolute;
         -webkit-text-fill-color: #5b0000;

  width: 100%;
         font-family: "Akronim", system-ui;
         font-style: normal;
         
            -webkit-text-stroke: 1px #bb4343}
            
            .breathing{
                 animation: breathe 3s ease 0s infinite normal forwards;
            }
        </style>
