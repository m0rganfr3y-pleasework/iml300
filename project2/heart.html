<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Heart</title>
        <link rel="stylesheet" href="style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
        <style>
        .hearttext{
         position:absolute;
         -webkit-text-fill-color: #8f4c4c;
         font-size: 50px;
         text-align: center;
         top: 50px;
         font-family: "Permanent Marker", cursive;
         font-style: normal;
         
         -webkit-text-stroke: 2px darkred
   
   
}
            #heartbeat{
                animation: heartbeat 3s ease 0s infinite normal forwards ;
            }
        </style>
    </head>
    <body>
    <img src="assets/heart.png" id = "heartbeat" height="100%"> 
    
     
    <details class = "hearttext">
     <summary>My heart beats too slow. </summary>
        <details>
            <summary>My heart beats too fast.</summary>
            My blood doesn't move right at all.
        </details>
        
    </details>
    
    </body>
